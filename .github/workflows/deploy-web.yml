name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Bad programme data should never reach attendees, so this runs before
      # the build and fails the deploy. See scripts/validate_data.py.
      - name: Validate programme data
        run: python3 scripts/validate_data.py
      - run: npx expo export -p web
      # The app is served from /vss-2026-scheduler/, not the domain root, so
      # every URL the build emits has to carry that prefix. Expo applies it from
      # experiments.baseUrl in app.json.
      #
      # This used to be a sed over index.html, which fixed the one URL that is
      # visible there — the JS bundle — and left the asset URLs baked into the
      # bundle itself pointing at the site root. The icon fonts are fetched at
      # runtime from those, so every one of them 404'd and every icon in the app
      # rendered as an empty box. A green deploy said nothing about it.
      - name: Check the base path reached every URL
        run: |
          if grep -q 'src="/_expo/' dist/index.html; then
            echo "index.html still has root-absolute bundle URLs: experiments.baseUrl did not apply"
            exit 1
          fi
          if grep -rq '"/assets/node_modules' dist/_expo/static/js/web/; then
            echo "bundle fetches assets from the site root; they will 404 under /vss-2026-scheduler/"
            exit 1
          fi
          font=$(ls dist/assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/MaterialCommunityIcons.*.ttf 2>/dev/null | head -1)
          if [ -z "$font" ]; then
            echo "the icon font is missing from the export"
            exit 1
          fi
          grep -rq "${font#dist/}" dist/_expo/static/js/web/ || {
            echo "the bundle does not reference the icon font that was exported"
            exit 1
          }
          echo "base path applied; icon font exported and referenced at $font"
      # The worker's cache name carries the app version, so each release gets a
      # fresh cache and the previous one is dropped on activation. Hard-coding
      # it in public/sw.js meant it drifted years out of date.
      - name: Stamp the service worker with the app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|__APP_VERSION__|$VERSION|g" dist/sw.js
          if grep -q "__APP_VERSION__" dist/sw.js; then
            echo "version placeholder was not replaced"; exit 1
          fi
          echo "service worker stamped with $VERSION"
      - name: Patch index.html for Safari PWA icon and name
        run: |
          python3 - <<'PYEOF'
          with open('dist/index.html', 'r') as f:
              html = f.read()
          tags = (
              '<link rel="apple-touch-icon" href="/vss-2026-scheduler/icons/icon-192.png">\n'
              '    <meta name="apple-mobile-web-app-capable" content="yes">\n'
              '    <meta name="apple-mobile-web-app-title" content="VSS 2026">\n'
              '    <meta name="apple-mobile-web-app-status-bar-style" content="default">\n'
          )
          html = html.replace('</head>', tags + '</head>')
          with open('dist/index.html', 'w') as f:
              f.write(html)
          print('Safari PWA tags injected')
          PYEOF
      - name: Inject PWA icons into manifest
        run: |
          python3 - <<'PYEOF'
          import json, os
          path = 'dist/manifest.json'
          if os.path.exists(path):
              with open(path) as f:
                  m = json.load(f)
              m['icons'] = [
                  {"src": "/vss-2026-scheduler/icons/icon-192.png", "sizes": "192x192", "type": "image/png"},
                  {"src": "/vss-2026-scheduler/icons/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
              ]
              with open(path, 'w') as f:
                  json.dump(m, f, indent=2)
              print('Icons injected into manifest.json')
          else:
              print('manifest.json not found, skipping')
          PYEOF
      - name: Build Jekyll docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./dist/docs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
